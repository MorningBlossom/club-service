name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  call-pipeline:
    uses: MorningBlossom/ci-cd/.github/workflows/ci-cd.yml@main
    with:
      go-version: '1.27'
      jira-key: 'CLUB'
    secrets: inherit